name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [3106, main]
  pull_request:
    branches: [3106, main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and scheme
        run: |
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSSix.xcodeproj

      # Pruebas internas del repo: informativas, ya no bloquean el IPA.
      - name: Policy tests (no bloquea)
        continue-on-error: true
        run: bash Tests/run_policy_tests.sh

      - name:
